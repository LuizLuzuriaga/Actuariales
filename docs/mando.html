<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0507" />
  <title>qx · Mando</title>
  <style>
    :root { --bg: #0a0507; --fg: #e6dfcd; --muted: #8a8470; --red: #b3202a; --amber: #c98d3a; --line: #3a3326; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: none; user-select: none; -webkit-user-select: none; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 15px Georgia, serif; overflow: hidden; overscroll-behavior: none; }
    body { padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0) env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0); }
    #bar { position: fixed; top: max(8px, env(safe-area-inset-top, 0px)); left: 0; right: 0; text-align: center; font: 12px ui-monospace, Consolas, monospace; letter-spacing: .1em; color: var(--muted); pointer-events: none; }
    #bar b { color: var(--amber); } #bar.ok b { color: #5fb87a; } #bar.bad b { color: var(--red); }
    .zone { position: fixed; bottom: 0; top: 0; }
    #L { left: 0; width: 42%; } #R { right: 0; width: 58%; }
    .hint { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); color: #3a3326; font: 13px ui-monospace, Consolas, monospace; text-align: center; pointer-events: none; }
    .stick { position: fixed; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; border: 2px solid #5a4a30; background: rgba(201,141,58,.08); display: none; pointer-events: none; }
    .stick i { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: #c98d3a; opacity: .8; }
    .btns { position: fixed; right: max(14px, env(safe-area-inset-right, 0px)); bottom: max(14px, env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: repeat(2, 64px); gap: 10px; z-index: 5; }
    .b { width: 64px; height: 64px; border-radius: 50%; border: 2px solid var(--line); background: rgba(10,10,12,.85); color: var(--fg); font: 600 14px Georgia, serif; display: grid; place-items: center; }
    .b.on, .b:active { background: #3a0f12; border-color: var(--red); }
    .b.fire { border-color: var(--red); color: #ff6a6a; } .b small { display: block; font: 9px ui-monospace, monospace; color: var(--muted); margin-top: 2px; }
    .top { position: fixed; left: 12px; bottom: max(14px, env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px; z-index: 5; }
    .t { padding: 10px 12px; border-radius: 6px; border: 1px solid var(--line); background: rgba(10,10,12,.85); color: var(--fg); font: 13px Georgia, serif; }
    #err { position: fixed; inset: 0; background: var(--bg); display: none; place-items: center; text-align: center; padding: 24px; z-index: 20; }
  </style>
</head>
<body>
  <div id="bar"><b>qx · mando</b> · <span id="st">conectando…</span></div>
  <div class="zone" id="L"><div class="hint">mover<br>(arrastra aquí)</div></div>
  <div class="zone" id="R"><div class="hint">mirar<br>(arrastra aquí)</div></div>
  <div class="stick" id="sL"><i></i></div><div class="stick" id="sR"><i></i></div>
  <div class="top"><button class="t" data-ev="skip">Avanzar</button><button class="t" data-ev="cam">Cámara</button></div>
  <div class="btns">
    <button class="b" data-ev="interact">E<small>actuar</small></button>
    <button class="b" data-ev="push">F<small>empujar</small></button>
    <button class="b" id="bRun">⇧<small>correr</small></button>
    <button class="b" id="bCr">C<small>agachar</small></button>
    <button class="b fire" id="bFire">●<small>disparar</small></button>
  </div>
  <div id="err"><div><h2>No se pudo conectar</h2><p id="errtxt">Abre la portada del juego en el ordenador, despliega «Jugar con el móvil» y vuelve a escanear el QR.</p></div></div>

  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script>
    (() => {
      const $ = (id) => document.getElementById(id), id = new URLSearchParams(location.search).get('id');
      const S = { mx: 0, my: 0, lx: 0, ly: 0, run: false, cr: false, sh: false }; let conn = null, ready = false;
      const st = (t, cls) => { $('st').textContent = t; $('bar').className = cls || ''; };
      if (!id || !window.Peer) { $('err').style.display = 'grid'; }
      else {
        const peer = new Peer();
        peer.on('open', () => { conn = peer.connect(id, { reliable: false }); conn.on('open', () => { ready = true; st('conectado', 'ok'); }); conn.on('close', () => { ready = false; st('desconectado', 'bad'); }); conn.on('error', () => st('error', 'bad')); });
        peer.on('error', (e) => { st('error: ' + (e && e.type), 'bad'); });
      }
      /* joysticks táctiles: el izquierdo mueve; el derecho mira (la mirada es la velocidad del dedo respecto al centro) */
      const stick = (zone, el, cb) => { let tid = null, ox = 0, oy = 0; const kn = el.firstElementChild;
        zone.addEventListener('pointerdown', (e) => { if (tid !== null) return; tid = e.pointerId; zone.setPointerCapture(tid); ox = e.clientX; oy = e.clientY; el.style.display = 'block'; el.style.left = ox + 'px'; el.style.top = oy + 'px'; kn.style.transform = ''; cb(0, 0); });
        zone.addEventListener('pointermove', (e) => { if (e.pointerId !== tid) return; const dx = Math.max(-1, Math.min(1, (e.clientX - ox) / 50)), dy = Math.max(-1, Math.min(1, (e.clientY - oy) / 50)); kn.style.transform = 'translate(' + dx * 34 + 'px,' + dy * 34 + 'px)'; cb(dx, dy); });
        const end = (e) => { if (e.pointerId !== tid) return; tid = null; el.style.display = 'none'; cb(0, 0); }; zone.addEventListener('pointerup', end); zone.addEventListener('pointercancel', end); };
      stick($('L'), $('sL'), (x, y) => { S.mx = x; S.my = y; });
      stick($('R'), $('sR'), (x, y) => { S.lx = x; S.ly = y; });
      document.querySelectorAll('[data-ev]').forEach((b) => b.addEventListener('pointerdown', (e) => { e.preventDefault(); if (ready) conn.send({ t: 'e', k: b.dataset.ev }); if (navigator.vibrate) navigator.vibrate(12); }));
      const tog = (el, key) => el.addEventListener('pointerdown', (e) => { e.preventDefault(); S[key] = !S[key]; el.classList.toggle('on', S[key]); });
      tog($('bRun'), 'run'); tog($('bCr'), 'cr');
      const fire = $('bFire'); fire.addEventListener('pointerdown', (e) => { e.preventDefault(); S.sh = true; fire.classList.add('on'); if (navigator.vibrate) navigator.vibrate(18); }); const stopFire = () => { S.sh = false; fire.classList.remove('on'); }; fire.addEventListener('pointerup', stopFire); fire.addEventListener('pointercancel', stopFire); fire.addEventListener('pointerleave', stopFire);
      setInterval(() => { if (ready) conn.send({ t: 's', mx: +S.mx.toFixed(2), my: +S.my.toFixed(2), lx: +S.lx.toFixed(2), ly: +S.ly.toFixed(2), run: S.run || !!S.hold, cr: S.cr, sh: S.sh }); }, 33);
      // correr automáticamente tras mantener el joystick hacia delante durante 3 s
      let held = 0; setInterval(() => { if (S.my < -0.7 && Math.hypot(S.mx, S.my) > 0.9) held += 0.1; else held = 0; S.hold = held >= 3; }, 100);
      try { if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(() => { }); } catch (e) { }
    })();
  </script>
</body>
</html>
